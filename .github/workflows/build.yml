name: Build Actually Parry (Fabric 1.20.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Run parry timing regression tests
        run: |
          mkdir -p build/test-classes
          javac -d build/test-classes src/main/java/dev/pota/weaponparry/core/ParryTimeline.java src/test/java/dev/pota/weaponparry/core/ParryTimelineTest.java
          javac -d build/test-classes src/main/java/dev/pota/weaponparry/core/ParryTimeline.java src/test/java/dev/pota/weaponparry/core/ParryTimelineReleaseTest.java
          java -cp build/test-classes dev.pota.weaponparry.core.ParryTimelineTest
          java -cp build/test-classes dev.pota.weaponparry.core.ParryTimelineReleaseTest
      - name: Build remapped Fabric mod JAR
        run: gradle --no-daemon clean build
      - name: Upload Fabric mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Actually-Parry-Fabric-1.20.1
          path: build/libs/actually-parry-1.1.3.jar
          if-no-files-found: error
